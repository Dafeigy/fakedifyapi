services:
  api:
    image: fakedifyapi:latest
    #build:
      #context: .
      #dockerfile: Dockerfile
    command: uvicorn src.main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - default
      - dify

networks:
  dify:
    external: true
    name: dify_v1111_default
